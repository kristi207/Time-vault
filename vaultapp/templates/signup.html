<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraBlog - Signup</title>
  <link rel="stylesheet" href="{% static 'vaultapp/CSS/style.css' %}">
  

</head>
<body>
  <script src="signup.js" defer></script>
    <div id="signup" class="container">
        <!-- Signup form content -->
      </div>
      
  <div class="container">
    <div class="form-container">
      <h1>AuraBlog</h1>
      <p>Join the community of storytellers!</p>
      <form>
        <div class="input-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" placeholder="Enter your name" required>
        </div>
        <div class="input-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="Enter your email" required>
        </div>
        <div class="input-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Enter a secure password" required>
        </div>
        <button type="submit" class="btn">Sign Up</button>
      </form>
      <p class="footer-text">Already have an account? <a href="#">Login</a></p>
    </div>
  </div>
  



</body>
</html>
